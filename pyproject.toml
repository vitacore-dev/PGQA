[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "/(\\.venv|\\.git|\\.pytest-cache)/"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
